services:
  feilian:
    image: ${FEILIAN_IMAGE:-ghcr.io/bt99bt/feilian-docker:latest}
    pull_policy: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:1080:1080"
    environment:
      - VPN_INTERFACE=${VPN_INTERFACE:-}
    volumes:
      - feilian-home-v3216:/home/feilian
    restart: unless-stopped

volumes:
  feilian-home-v3216:
